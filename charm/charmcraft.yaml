# This file configures Charmcraft.
# See https://juju.is/docs/sdk/charmcraft-config for guidance.
# For questions or help, visit https://matrix.to/#/#12-factor-charms:ubuntu.com 

name: charm-registry
license: Apache-2.0

type: charm

base: ubuntu@24.04

# the platforms this charm should be built on and run on.
# you can check your architecture with `dpkg --print-architecture`
platforms:
  amd64:
  # arm64:
  # ppc64el:
  # s390x:

# (Required)
summary: Private charm registry for Juju and charmcraft workflows

# (Required)
description: |
  Go-based private charm registry with Charmhub-compatible APIs,
  PostgreSQL metadata storage, S3-backed artifact storage, and an
  embedded OCI registry for charm resource workflows.

extensions:
  - go-framework

requires:
#   mysql:
#     interface: mysql_client
#     optional: false
#     limit: 1
  postgresql:
    interface: postgresql_client
    optional: true
    limit: 1
#   mongodb:
#     interface: mongodb_client
#     optional: false
#     limit: 1
#   redis:
#     interface: redis
#     optional: false
#     limit: 1
  s3:
    interface: s3
    optional: true
    limit: 1
  oci-s3:
    interface: s3
    optional: true
    limit: 1
#   saml:
#     interface: saml
#     optional: false
#     limit: 1
#   rabbitmq:
#     interface: rabbitmq
#     optional: false
#     limit: 1
#   tracing:
#     interface: tracing
#     optional: true
#     limit: 1
#   smtp:
#     interface: smtp
#     optional: false
#     limit: 1
#   openfga:
#     interface: openfga
#     optional: false
#     limit: 1
#   http-proxy:
#     interface: http_proxy
#     optional: true
#     limit: 1
  openid:
    interface: oauth
    optional: true
    limit: 1
  oci-ingress:
    interface: ingress
    optional: false
    limit: 1

config:
  options:
    oci-internal-url:
      type: string
      default: http://127.0.0.1:5000
      description: >-
        URL used by the registry process to reach its embedded OCI listener.
        Plain HTTP by default: the workload serves without TLS and relies on
        the ingress relations for TLS termination.
    oci-s3-prefix:
      type: string
      default: oci
      description: S3 key prefix used by the embedded OCI registry backend.
    oci-project-prefix:
      type: string
      default: charm
      description: Prefix for registry-managed OCI project names.
    oci-pull-robot-prefix:
      type: string
      default: pull
      description: Prefix for generated OCI pull robot accounts.
    oci-push-robot-prefix:
      type: string
      default: push
      description: Prefix for generated OCI push robot accounts.
    charmhub-url:
      type: string
      default: https://api.charmhub.io
      description: Upstream Charmhub API base URL for synchronization.
    charmhub-sync-interval:
      type: string
      default: 15m
      description: Interval between background Charmhub synchronization scans.
    enable-insecure-dev-auth:
      type: boolean
      default: false
      description: Enable development-only bearer tokens when OIDC is not related.
    admin-subjects:
      type: string
      description: Comma-separated OIDC subject values that should be registry admins.
    admin-emails:
      type: string
      description: Comma-separated OIDC email values that should be registry admins.
    admin-usernames:
      type: string
      description: Comma-separated OIDC username values that should be registry admins.
