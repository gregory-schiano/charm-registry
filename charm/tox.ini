[tox]
no_package = True
skip_missing_interpreters = True
env_list = format, lint, static
min_version = 4.0.0

[vars]
src_path = {tox_root}/src
tests_path = {tox_root}/../tests
charm_tests_path = {tox_root}/../tests/integration/charm
all_path = {[vars]src_path}

[testenv]
base_python = python3.12
set_env =
    PYTHONPATH = {tox_root}/lib:{[vars]src_path}
    PYTHONBREAKPOINT=pdb.set_trace
    PY_COLORS=1
pass_env =
    PYTHONPATH
    PYTEST_ADDOPTS
    CHARM_BUILD_DIR
    CONCIERGE
    JUB_*
    JUJU_*
    KUBECONFIG
    MODEL_SETTINGS
    OPCLI_*
    SPREAD_JOB

[testenv:format]
description = Apply coding style standards to code
deps =
    ruff
commands =
    ruff format {[vars]all_path}
    ruff check --fix {[vars]all_path}

[testenv:lint]
description = Check code against coding style standards
deps =
    ruff
    codespell
commands =
    codespell {tox_root}
    ruff check {[vars]all_path}
    ruff format --check --diff {[vars]all_path}

[testenv:unit]
description = Run unit tests
deps =
    pytest
    coverage[toml]
    .
commands =
    coverage run --source={[vars]src_path} \
                 -m pytest \
                 --tb native \
                 -v \
                 -s \
                 {posargs} \
                 {[vars]tests_path}/unit
    coverage report

[testenv:static]
description = Run static type checks
deps =
    pyright
    .
commands =
    pyright {posargs}

[testenv:integration]
description = Run Jubilant charm integration tests
deps =
    opcli[cli] @ git+https://github.com/canonical/charm-ci.git@main
    jubilant>=1.0,<2.0
    pytest>=7.0
    requests>=2.28
    -r {[vars]charm_tests_path}/requirements.txt
commands =
    pytest -v \
           -s \
           --tb native \
           --log-cli-level=INFO \
           {posargs} \
           {[vars]charm_tests_path}
