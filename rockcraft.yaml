# rockcraft.yaml — OCI rock definition for charm-registry
#
# Uses the go-framework extension which:
#   - Compiles the Go binary from cmd/charm-registry
#   - Installs it at /usr/local/bin/charm-registry
#   - Generates a Pebble service layer for the charm runtime
#
# See https://documentation.ubuntu.com/rockcraft/latest/reference/extensions/go-framework

name: charm-registry
base: bare
build-base: ubuntu@24.04
version: '0.1'
summary: Private charm registry for Juju and charmcraft workflows
description: |
    Go-based private charm registry with Charmhub-compatible APIs,
    PostgreSQL metadata storage, S3-backed artifact storage, and an
    embedded OCI registry for charm resource workflows.

platforms:
    amd64:

extensions:
    - go-framework

parts:

  go-framework/install-app:
    build-snaps:
      - go/1.26/stable
    organize:
      # Include the admin CLI alongside the main server binary.
      bin/charm-registryctl: usr/local/bin/charm-registryctl
