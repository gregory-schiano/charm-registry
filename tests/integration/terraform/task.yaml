summary: Deploy the Terraform stack from a snap-backed charm registry.

description: |
  Start the charm-registry snap as a private Charmhub-compatible registry,
  publish the built charm-registry charm into it, mirror the public dependency
  charms needed by the Terraform stack, set Juju's model charmhub-url to the
  private registry through Terraform model config, and verify the deployed
  stack with the shared functional scenarios.

systems: [ubuntu-24.04]

environment:
  TF_MODEL_NAME: charm-registry-tf
  TF_API_HOSTNAME: api.charm-registry-tf.test
  TF_OCI_HOSTNAME: oci.charm-registry-tf.test
  TF_VAR_app_secret_key: integration-test-secret

prepare: |
  set -euo pipefail

  if ! command -v terraform >/dev/null 2>&1; then
    snap install terraform --classic
  fi
  apt-get update
  apt-get install -y python3-yaml

  cd "$PROJECT_DIR"
  go build -o "$PROJECT_DIR/.bin/functional-test" ./cmd/functional-test

  SNAP_PATH="$(find "$PROJECT_DIR" -maxdepth 4 -type f -name 'spellbook_*.snap' | sort | head -1)"
  if [ -z "$SNAP_PATH" ]; then
    echo "FAIL: no spellbook snap artifact found"
    exit 1
  fi

  snap install --dangerous "$SNAP_PATH"

  HOST_IP="$(ip -4 route get 1.1.1.1 | awk '{for (i=1; i<=NF; i++) if ($i == "src") {print $(i+1); exit}}')"
  if [ -z "$HOST_IP" ]; then
    echo "FAIL: unable to determine host IP for the snap registry"
    exit 1
  fi

  export TERRAFORM_REGISTRY_API_URL="http://${HOST_IP}:8080"
  export TERRAFORM_REGISTRY_OCI_URL="https://${HOST_IP}:5000"
  echo "$TERRAFORM_REGISTRY_API_URL" > "$PROJECT_DIR/.terraform-registry-api-url"
  echo "$TERRAFORM_REGISTRY_OCI_URL" > "$PROJECT_DIR/.terraform-registry-oci-url"

  snap set "$SNAP_NAME" \
    admin.usernames="$FTEST_ADMIN_USER" \
    insecure-dev-auth=true \
    oci.secret-key=integration-test-oci-secret \
    public-api-url="$TERRAFORM_REGISTRY_API_URL" \
    public-storage-url="$TERRAFORM_REGISTRY_API_URL" \
    public-registry-url="$TERRAFORM_REGISTRY_OCI_URL" \
    rate-limit.ip-limit=0 \
    rate-limit.token-limit=0

  snap start "$SNAP_NAME.charm-registry"

  for i in $(seq 1 120); do
    if curl -sf "${TERRAFORM_REGISTRY_API_URL}/healthz" >/dev/null 2>&1; then
      echo "charm-registry snap is healthy after ${i}s"
      break
    fi
    if [ "$i" -eq 120 ]; then
      echo "FAIL: snap registry did not become healthy"
      snap logs "$SNAP_NAME.charm-registry" -n 100
      exit 1
    fi
    sleep 1
  done

  CHARM_REGISTRY_PUBLIC_REGISTRY_URL="$TERRAFORM_REGISTRY_OCI_URL" \
  CHARM_REGISTRY_K8S_OCI_CA_FILE="/var/snap/${SNAP_NAME}/common/certs/oci.crt" \
    bash "$PROJECT_DIR/deploy/k8s/install-oci-cert.sh"
  kubectl wait --for=condition=Ready node --all --timeout=5m

  python3 "$PROJECT_DIR/tests/integration/terraform/publish_charm.py" \
    --registry-url "$TERRAFORM_REGISTRY_API_URL" \
    --token "dev:admin:${FTEST_ADMIN_USER}" \
    --charm-name charm-registry \
    --channel latest/edge \
    --charm-file "$(find "$PROJECT_DIR" -maxdepth 4 -type f -name 'charm-registry*.charm' | sort | head -1)"

  python3 "$PROJECT_DIR/tests/integration/terraform/sync_dependencies.py" \
    --registry-url "$TERRAFORM_REGISTRY_API_URL" \
    --token "dev:admin:${FTEST_ADMIN_USER}"

restore: |
  set +e
  cd "$PROJECT_DIR/terraform"
  if [ -f terraform.tfvars ]; then
    terraform destroy -auto-approve
  fi
  rm -f terraform.tfvars
  rm -rf .terraform
  snap remove --purge "$SNAP_NAME"
  rm -f "$PROJECT_DIR/.terraform-registry-api-url" "$PROJECT_DIR/.terraform-registry-oci-url"

execute: |
  set -euo pipefail

  cd "$PROJECT_DIR"

  APP_IMAGE="$(python3 tests/integration/terraform/resolve_app_image.py)"
  REGISTRY_API_URL="$(cat "$PROJECT_DIR/.terraform-registry-api-url")"

  cat > "$PROJECT_DIR/terraform/terraform.tfvars" <<EOF
  model_name = "${TF_MODEL_NAME}"
  model_config = {
    "test-mode"                   = "true"
    "automatically-retry-hooks"   = "false"
    "update-status-hook-interval" = "1m"
    "charmhub-url"                = "${REGISTRY_API_URL}"
  }
  app_charm_name = "charm-registry"
  app_channel = "latest/edge"
  app_image = "${APP_IMAGE}"
  app_secret_key = "${TF_VAR_app_secret_key}"
  admin_usernames = "${FTEST_ADMIN_USER}"
  enable_insecure_dev_auth = true
  extra_app_config = {
    "rate-limit-ip-limit" = 0
  }
  gateway_class = "ck-gateway"
  api_hostname = "${TF_API_HOSTNAME}"
  oci_hostname = "${TF_OCI_HOSTNAME}"
  EOF

  cd "$PROJECT_DIR/terraform"
  terraform init -input=false
  terraform validate
  terraform apply -auto-approve

  juju wait-for application -m "$TF_MODEL_NAME" charm-registry --timeout=30m
  juju status -m "$TF_MODEL_NAME" --relations --color=false

  UNIT_ADDRESS="$(juju status -m "$TF_MODEL_NAME" --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["applications"]["charm-registry"]["units"]["charm-registry/0"]["address"])')"
  export FTEST_API_URL="http://${UNIT_ADDRESS}:8080"
  export FTEST_OCI_URL="http://${UNIT_ADDRESS}:5000"
  export FTEST_ADMIN_SUBJECT=admin
  export FTEST_ADMIN_USER="$FTEST_ADMIN_USER"
  unset FTEST_OCI_CERT_PATH

  "$PROJECT_DIR/.bin/functional-test"

debug: |
  set +e
  cd "$PROJECT_DIR"
  snap logs "$SNAP_NAME.charm-registry" -n 100
  snap services "$SNAP_NAME"
  if juju models --format json | grep -q "\"${TF_MODEL_NAME}\""; then
    juju status -m "$TF_MODEL_NAME" --relations --storage
    juju debug-log -m "$TF_MODEL_NAME" --replay --tail 300
    kubectl get gateway -n "$TF_MODEL_NAME" -o wide
    kubectl get httproutes -n "$TF_MODEL_NAME" -o wide
    kubectl get svc -n "$TF_MODEL_NAME" -o wide
  fi
