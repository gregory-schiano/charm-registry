name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

env:
  GO_VERSION: "1.26.4"

jobs:
  actionlint:
    name: GitHub Actions Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run actionlint
        run: make actionlint

  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify module tidiness
        run: make tidy-check

      - name: Run go vet
        run: make vet

      - name: Run golangci-lint
        run: make lint

      - name: Verify sqlc generated code is up-to-date
        run: |
          if ! make sqlc-diff; then
            echo "::error::sqlc-generated code is out of sync with query files. Run 'sqlc generate' and commit the result."
            exit 1
          fi

  security:
    name: Go Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run govulncheck
        run: make vuln

      - name: Run gosec
        run: make gosec

  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run unit tests (fail-fast)
        run: make test

      - name: Run tests with coverage
        run: make coverage

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $NF}' | tr -d '%')
          echo "Total test coverage: ${COVERAGE}%"
          THRESHOLD=65
          if [ "$(echo "${COVERAGE} < ${THRESHOLD}" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below the ${THRESHOLD}% threshold"
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build:
    name: Go Build
    runs-on: ubuntu-latest
    needs: [lint, security, test]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binaries
        run: make build

      - name: Upload binary artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: charm-registry-binaries
          path: .bin/
          retention-days: 7

  integration-smoke:
    name: Go Integration Smoke
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build server binary
        run: CGO_ENABLED=0 go build -o .bin/charm-registry ./cmd/charm-registry

      - name: Start server
        env:
          CHARM_REGISTRY_DATABASE_BACKEND: sqlite
          CHARM_REGISTRY_ENABLE_INSECURE_DEV_AUTH: "true"
          CHARM_REGISTRY_LISTEN: ":8080"
          CHARM_REGISTRY_OCI_SECRET_KEY: integration-test-secret
        run: |
          .bin/charm-registry &
          echo $! > /tmp/charm-registry.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Server did not become healthy within 30s"
          SERVER_PID=$(cat /tmp/charm-registry.pid)
          kill "$SERVER_PID" 2>/dev/null || true
          exit 1

      - name: Run BOOT integration tests
        env:
          ITEST_API_URL: http://localhost:8080
        run: go test -tags=integration -run 'TestBOOT0[1-5]_' -v -count=1 ./tests/integration/

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/charm-registry.pid ]; then
            SERVER_PID=$(cat /tmp/charm-registry.pid)
            kill "$SERVER_PID" 2>/dev/null || true
          fi

  charm-build:
    name: Charm Pack
    needs: [build]
    uses: canonical/data-platform-workflows/.github/workflows/build_charm.yaml@v49
    with:
      artifact-prefix: charm-registry-charm
      path-to-charm-directory: charm

  rock-build:
    name: Rock Pack
    needs: [build]
    uses: canonical/data-platform-workflows/.github/workflows/build_rock.yaml@v49
    with:
      artifact-prefix: charm-registry-rock
      path-to-rock-directory: .

  snap-build:
    name: Snap Pack
    needs: [build]
    uses: canonical/data-platform-workflows/.github/workflows/build_snap.yaml@v49
    with:
      artifact-prefix: charm-registry-snap
      path-to-snap-project-directory: .

  required-status-checks:
    name: Required status checks
    runs-on: ubuntu-latest
    needs: [actionlint, lint, security, test, build, integration-smoke, charm-build, rock-build, snap-build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          set -e
          FAILED=""
          check_job() { if [ "$2" != "success" ]; then FAILED="$FAILED $1($2)"; fi; }
          check_job actionlint "${{ needs.actionlint.result }}"
          check_job lint "${{ needs.lint.result }}"
          check_job security "${{ needs.security.result }}"
          check_job test "${{ needs.test.result }}"
          check_job build "${{ needs.build.result }}"
          check_job integration-smoke "${{ needs.integration-smoke.result }}"
          check_job charm-build "${{ needs.charm-build.result }}"
          check_job rock-build "${{ needs.rock-build.result }}"
          check_job snap-build "${{ needs.snap-build.result }}"
          if [ -n "$FAILED" ]; then
            echo "::error::One or more required jobs failed or were skipped:$FAILED"
            exit 1
          fi
          echo "All required status checks passed."
