name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; only the artifact-build job needs packages: write.
permissions:
  contents: read

env:
  GO_VERSION: "1.26.4"

jobs:
  actionlint:
    name: GitHub Actions Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run actionlint
        run: make actionlint

  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify module tidiness
        run: make tidy-check

      - name: Run go vet
        run: make vet

      - name: Run golangci-lint
        run: make lint

      - name: Verify sqlc generated code is up-to-date
        run: |
          if ! make sqlc-diff; then
            echo "::error::sqlc-generated code is out of sync with query files. Run 'sqlc generate' and commit the result."
            exit 1
          fi

  security:
    name: Go Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run govulncheck
        run: make vuln

      - name: Run gosec
        run: make gosec

  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests with race detector and coverage
        run: make coverage-race

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $NF}' | tr -d '%')
          echo "Total test coverage: ${COVERAGE}%"
          THRESHOLD=65
          if [ "$(echo "${COVERAGE} < ${THRESHOLD}" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below the ${THRESHOLD}% threshold"
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  charm:
    name: Charm Python Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install tox
        run: pipx install tox

      - name: Lint, type-check, and unit-test the charm
        working-directory: charm
        run: tox -e lint,static,unit

  # Fast static validation of the Terraform module so syntax/format errors
  # surface on the PR instead of deep inside the spread integration run.
  terraform:
    name: Terraform Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check formatting
        run: terraform fmt -check -recursive -diff terraform/

      - name: Validate module
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

  build:
    name: Go Build
    runs-on: ubuntu-latest
    needs: [lint, security, test]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binaries
        run: make build

      - name: Upload binary artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: charm-registry-binaries
          path: .bin/
          retention-days: 7

  integration-smoke:
    name: Go Integration Smoke
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build server binary
        run: CGO_ENABLED=0 go build -o .bin/charm-registry ./cmd/charm-registry

      - name: Start server
        env:
          CHARM_REGISTRY_DATABASE_BACKEND: sqlite
          CHARM_REGISTRY_ENABLE_INSECURE_DEV_AUTH: "true"
          CHARM_REGISTRY_LISTEN: ":8080"
          CHARM_REGISTRY_OCI_SECRET_KEY: integration-test-secret
        run: |
          .bin/charm-registry &
          echo $! > /tmp/charm-registry.pid
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz >/dev/null 2>&1; then
              exit 0
            fi
            echo "Waiting for server (${attempt}/30)"
            sleep 1
          done
          echo "::error::Server did not become healthy within 30s"
          SERVER_PID=$(cat /tmp/charm-registry.pid)
          kill "$SERVER_PID" 2>/dev/null || true
          exit 1

      - name: Run BOOT integration tests
        env:
          ITEST_API_URL: http://localhost:8080
        run: go test -tags=integration -run 'TestBOOT0[1-5]_' -v -count=1 ./tests/integration/

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/charm-registry.pid ]; then
            SERVER_PID=$(cat /tmp/charm-registry.pid)
            kill "$SERVER_PID" 2>/dev/null || true
          fi

  # Note: charm/rock/snap packaging is exercised by the Integration Tests
  # workflow (integration.yml), which builds all three artifacts once on the
  # same push/PR trigger before running them. Building them here as well would
  # pack every artifact twice per change, so this workflow stays Go-focused.

  required-status-checks:
    name: Required status checks
    runs-on: ubuntu-latest
    needs: [actionlint, lint, charm, terraform, security, test, build, integration-smoke]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          set -e
          FAILED=""
          check_job() { if [ "$2" != "success" ]; then FAILED="$FAILED $1($2)"; fi; }
          check_job actionlint "${{ needs.actionlint.result }}"
          check_job lint "${{ needs.lint.result }}"
          check_job charm "${{ needs.charm.result }}"
          check_job terraform "${{ needs.terraform.result }}"
          check_job security "${{ needs.security.result }}"
          check_job test "${{ needs.test.result }}"
          check_job build "${{ needs.build.result }}"
          check_job integration-smoke "${{ needs.integration-smoke.result }}"
          if [ -n "$FAILED" ]; then
            echo "::error::One or more required jobs failed or were skipped:$FAILED"
            exit 1
          fi
          echo "All required status checks passed."
