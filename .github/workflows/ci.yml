name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.4"

jobs:
  actionlint:
    name: GitHub Actions Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0c011c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run actionlint
        run: make actionlint

  # ── Go source quality ────────────────────────────────────────────────

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0c011c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify module tidiness
        run: make tidy-check

      - name: Run go vet
        run: make vet

      - name: Run golangci-lint
        run: make lint

      - name: Verify sqlc generated code is up-to-date
        run: |
          if ! make sqlc-diff; then
            echo "::error::sqlc-generated code is out of sync with query files. Run 'sqlc generate' and commit the result."
            exit 1
          fi

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0c011c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run govulncheck
        run: make vuln

      - name: Run gosec
        run: make gosec

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0c011c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run unit tests (fail-fast)
        run: make test

      - name: Run tests with coverage
        run: make coverage

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $NF}' | tr -d '%')
          echo "Total test coverage: ${COVERAGE}%"
          # Baseline measured 2026-06-10: 66.7% (post-test-additions).
          # Ratchet policy: see docs/coverage-policy.md.
          # This threshold should only increase, never decrease.
          # When coverage improves sustainably, update the threshold here
          # and in the policy doc.
          THRESHOLD=65
          if [ "$(echo "${COVERAGE} < ${THRESHOLD}" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below the ${THRESHOLD}% threshold"
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, security, test]
    steps:
      - uses: actions/checkout@34e114876b0c011c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binaries
        run: make build

      - name: Upload binary artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: charm-registry-binaries
          path: .bin/
          retention-days: 7

  # ── Artifact packaging ───────────────────────────────────────────────

  charm-build:
    name: Charm Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0c011c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install charmcraft
        run: sudo snap install charmcraft --classic

      - name: Pack charm
        run: |
          cd charm
          charmcraft pack

      - name: Upload charm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: charm-registry-charm
          path: charm/*.charm
          retention-days: 7

  rock-build:
    name: Rock Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0c011c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install LXD
        run: |
          sudo snap install lxd
          sudo lxd init --auto
          sudo usermod -aG lxd "$USER"

      - name: Install rockcraft
        run: sudo snap install rockcraft --classic

      - name: Pack rock
        # Use newgrp so the lxd group membership is effective in the same step
        run: sg lxd -c 'rockcraft pack'

      - name: Smoke-test rock artifact
        run: |
          ROCK_FILE=$(ls *.rock 2>/dev/null | head -1)
          if [ -z "$ROCK_FILE" ]; then
            echo "::error::No .rock file produced"
            exit 1
          fi
          bash scripts/rock-smoke-test.sh "$ROCK_FILE"

      - name: Upload rock artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: charm-registry-rock
          path: "*.rock"
          retention-days: 7

  snap-build:
    name: Snap Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0c011c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Install LXD (required by snapcraft)
        run: |
          sudo snap install lxd
          sudo lxd init --auto

      - name: Pack snap
        run: snapcraft pack --use-lxd

      - name: Upload snap artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: charm-registry-snap
          path: "*.snap"
          retention-days: 7

  # ── Required status check gate ───────────────────────────────────────

  required-status-checks:
    name: Required status checks
    runs-on: ubuntu-latest
    needs: [actionlint, lint, security, test, build, charm-build, rock-build, snap-build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          set -e
          FAILED=""
          check_job() { if [ "$2" != "success" ]; then FAILED="$FAILED $1($2)"; fi; }
          check_job actionlint "${{ needs.actionlint.result }}"
          check_job lint "${{ needs.lint.result }}"
          check_job security "${{ needs.security.result }}"
          check_job test "${{ needs.test.result }}"
          check_job build "${{ needs.build.result }}"
          check_job charm-build "${{ needs.charm-build.result }}"
          check_job rock-build "${{ needs.rock-build.result }}"
          check_job snap-build "${{ needs.snap-build.result }}"
          if [ -n "$FAILED" ]; then
            echo "::error::One or more required jobs failed or were skipped:$FAILED"
            exit 1
          fi
          echo "All required status checks passed."
