name: Build Artifacts

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      upload-image:
        type: string
        default: "artifact"
      build-timeout-minutes:
        type: number
        default: 60
      charmcraft-channel:
        type: string
        default: "latest/edge"
      rockcraft-channel:
        type: string
        default: "latest/stable"

jobs:
  build-matrix:
    name: Build matrix
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      opcli-sha: ${{ steps.workflow-version.outputs.sha }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set opcli version
        id: workflow-version
        run: echo "sha=main" >> "$GITHUB_OUTPUT"

      - name: Install uv
        run: sudo snap install astral-uv --classic

      - name: Install opcli
        run: uv tool install "opcli[cli] @ git+https://github.com/canonical/charm-ci.git@${{ steps.workflow-version.outputs.sha }}"

      - name: Generate build matrix
        id: matrix
        run: |
          matrix=$(opcli artifacts matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Build matrix: $matrix"

  build:
    name: "Build ${{ matrix.type }} ${{ matrix.name }} (${{ matrix.arch }})"
    needs: build-matrix
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: ${{ inputs.build-timeout-minutes }}
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        run: sudo snap install astral-uv --classic

      - name: Install opcli
        run: uv tool install "opcli[cli] @ git+https://github.com/canonical/charm-ci.git@${{ needs.build-matrix.outputs.opcli-sha }}"

      - name: Install LXD
        run: |
          sudo snap install lxd
          sudo lxd waitready
          sudo lxd init --auto
          sudo usermod -aG lxd "$USER"
          sudo chmod 0666 /var/snap/lxd/common/lxd/unix.socket
          if sudo iptables -nL DOCKER-USER 2>/dev/null; then
            sudo iptables -I DOCKER-USER -i lxdbr0 -j ACCEPT
            sudo iptables -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          fi
          if sudo ip6tables -nL DOCKER-USER 2>/dev/null; then
            sudo ip6tables -I DOCKER-USER -i lxdbr0 -j ACCEPT
            sudo ip6tables -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          fi

      - name: Install charmcraft
        if: matrix.type == 'charm'
        run: sudo snap install charmcraft --classic --channel=${{ inputs.charmcraft-channel }}

      - name: Install rockcraft
        if: matrix.type == 'rock'
        run: sudo snap install rockcraft --classic --channel=${{ inputs.rockcraft-channel }}

      - name: Install snapcraft
        if: matrix.type == 'snap'
        run: sudo snap install snapcraft --classic

      - name: Build ${{ matrix.type }} ${{ matrix.name }}
        run: |
          clean_rockcraft_state() {
            rockcraft clean || true
            rm -rf \
              "${HOME}/.cache/rockcraft" \
              "${HOME}/.local/state/rockcraft" \
              "${HOME}/snap/rockcraft/common/cache" \
              "${HOME}/snap/rockcraft/common/state" || true
            if command -v lxc >/dev/null 2>&1; then
              projects=$(lxc project list --format csv 2>/dev/null | cut -d, -f1 || true)
              printf '%s\n' "$projects" | while IFS= read -r project; do
                [ -n "$project" ] || continue
                instances=$(lxc list --project "$project" --format csv -c n 2>/dev/null || true)
                printf '%s\n' "$instances" | while IFS= read -r instance; do
                  case "$instance" in
                    *rockcraft*|*craft*)
                      lxc delete --project "$project" --force "$instance" || true
                      ;;
                  esac
                done
                images=$(lxc image list --project "$project" --format csv -c f 2>/dev/null || true)
                printf '%s\n' "$images" | while IFS= read -r fingerprint; do
                  [ -n "$fingerprint" ] || continue
                  lxc image delete --project "$project" "$fingerprint" || true
                done
              done
            fi
          }

          if [ "${{ matrix.type }}" = "rock" ]; then
            attempts=6
          else
            attempts=3
          fi

          for attempt in $(seq 1 "$attempts"); do
            build_log="$(mktemp)"
            set +e
            opcli artifacts build \
              --${{ matrix.type }} ${{ matrix.name }} \
              --build-timeout $(( ${{ inputs.build-timeout-minutes }} * 60 )) \
              2>&1 | tee "$build_log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              rm -f "$build_log"
              exit 0
            fi
            if [ "$attempt" = "$attempts" ]; then
              rm -f "$build_log"
              exit 1
            fi
            sleep_seconds=$(( attempt * 60 ))
            if [ "${{ matrix.type }}" = "rock" ]; then
              clean_rockcraft_state
              if grep -q "expected digest .* got .*\\|Failed to cut requested chisel slices" "$build_log"; then
                # Chisel can read a newly published InRelease while archive.ubuntu.com
                # still serves the previous Packages/deb content. This upstream race
                # can last tens of minutes, so short immediate retries are ineffective.
                sleep_seconds=600
              fi
            fi
            rm -f "$build_log"
            sleep "$sleep_seconds"
          done
        env:
          CHARMCRAFT_ENABLE_EXPERIMENTAL_EXTENSIONS: "1"
          ROCKCRAFT_ENABLE_EXPERIMENTAL_EXTENSIONS: "1"
          OPCLI_ROCK_UPLOAD: ${{ inputs.upload-image }}

      - name: Upload ${{ matrix.type }} ${{ matrix.name }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: built-${{ matrix.type }}-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ inputs.working-directory }}/**/*.${{ matrix.type }}
          if-no-files-found: error

      - name: Upload partial build manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifacts-build-${{ matrix.type }}-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ inputs.working-directory }}/artifacts.build.yaml
          if-no-files-found: error

  collect:
    name: Collect artifacts
    needs: [build-matrix, build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        run: sudo snap install astral-uv --classic

      - name: Install opcli
        run: uv tool install "opcli[cli] @ git+https://github.com/canonical/charm-ci.git@${{ needs.build-matrix.outputs.opcli-sha }}"

      - name: Download build partials
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: artifacts-build-*
          path: ${{ inputs.working-directory }}/partial-artifacts/

      - name: Merge build manifests
        run: |
          mapfile -t partials < <(find ./partial-artifacts -name "artifacts.build.yaml" | sort)
          opcli artifacts collect "${partials[@]}"

      - name: Upload build manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifacts-build
          path: ${{ inputs.working-directory }}/artifacts.build.yaml
          if-no-files-found: error
