name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "v[0-9]+.[0-9]+.[0-9]+*-rc[0-9]+"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build all artifacts but skip publishing to stores/registries"
        type: boolean
        default: true
      tag:
        description: "Release tag (e.g. v1.2.3 or v1.2.3-rc1)"
        type: string
        required: true
      rock_registry:
        description: "OCI registry for rock push (default: ghcr.io)"
        type: string
        default: "ghcr.io"

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  GO_VERSION: "1.26.4"

jobs:
  # ── Derive publish parameters ─────────────────────────────────────
  release-metadata:
    name: Derive release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
      is_rc: ${{ steps.meta.outputs.is_rc }}
      is_dry_run: ${{ steps.meta.outputs.is_dry_run }}
      rock_registry: ${{ steps.meta.outputs.rock_registry }}
      rock_image: ${{ steps.meta.outputs.rock_image }}
      built_sha: ${{ steps.resolve.outputs.built_sha }}
    steps:
      - id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # Determine channel based on tag pattern
          if echo "${TAG}" | grep -qE '^-rc[0-9]+$|rc[0-9]+$'; then
            echo "channel=latest/edge" >> "$GITHUB_OUTPUT"
            echo "is_rc=true" >> "$GITHUB_OUTPUT"
          else
            echo "channel=latest/stable" >> "$GITHUB_OUTPUT"
            echo "is_rc=false" >> "$GITHUB_OUTPUT"
          fi

          # Dry-run: true when workflow_dispatch with dry_run=true, OR workflow_dispatch with
          # dry_run not explicitly set to false. Tag-push events always publish (dry_run=false).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
              echo "is_dry_run=false" >> "$GITHUB_OUTPUT"
            else
              echo "is_dry_run=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "is_dry_run=false" >> "$GITHUB_OUTPUT"
          fi

          # Rock registry: input override or GHCR default
          REGISTRY="${{ github.event.inputs.rock_registry || 'ghcr.io' }}"
          echo "rock_registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "rock_image=${REGISTRY}/${{ github.repository }}" >> "$GITHUB_OUTPUT"

      - name: Checkout requested ref
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - id: resolve
        name: Record built SHA
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "::notice::Release build ref=${{ steps.meta.outputs.tag }} SHA=${SHA}"
          echo "built_sha=${SHA}" >> "$GITHUB_OUTPUT"

  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    needs: release-metadata
    steps:
      - name: Check tag format
        run: |
          TAG="${{ needs.release-metadata.outputs.tag }}"
          if ! echo "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$'; then
            echo "::error::Tag '${TAG}' does not match expected semver pattern (vX.Y.Z or vX.Y.Z-rcN)"
            exit 1
          fi
          echo "Release tag validated: ${TAG}"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [release-metadata, validate-tag]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.release-metadata.outputs.tag }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run audit
        run: make audit

      - name: Run unit tests with coverage
        run: make coverage

  integration-smoke:
    name: Integration Smoke
    runs-on: ubuntu-latest
    needs: [release-metadata, validate-tag, test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.release-metadata.outputs.tag }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build server binary
        run: CGO_ENABLED=0 go build -o .bin/charm-registry ./cmd/charm-registry

      - name: Start server (SQLite + dev auth)
        env:
          CHARM_REGISTRY_DATABASE_BACKEND: sqlite
          CHARM_REGISTRY_ENABLE_INSECURE_DEV_AUTH: "true"
          CHARM_REGISTRY_LISTEN: ":8080"
          CHARM_REGISTRY_OCI_SECRET_KEY: integration-test-secret
        run: |
          .bin/charm-registry &
          echo $! > /tmp/charm-registry.pid
          # Wait for health endpoint (up to 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "Server healthy after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::Server did not become healthy within 30s"
              SERVER_PID=$(cat /tmp/charm-registry.pid)
              kill "$SERVER_PID" 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

      - name: Run BOOT integration tests
        env:
          ITEST_API_URL: http://localhost:8080
        run: go test -tags=integration -run TestBOOT -v -count=1 ./tests/integration/

      - name: Stop server
        if: always()
        run: |
          SERVER_PID=$(cat /tmp/charm-registry.pid)
          kill "$SERVER_PID" 2>/dev/null || true

  build-binaries:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: [release-metadata, validate-tag, test, integration-smoke]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.release-metadata.outputs.tag }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build charm-registry
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -buildvcs=true \
            -ldflags="-s -w -buildid=" \
            -o dist/charm-registry-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/charm-registry

      - name: Build charm-registryctl
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          CGO_ENABLED=0 go build -trimpath -buildvcs=true \
            -ldflags="-s -w -buildid=" \
            -o dist/charm-registryctl-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/charm-registryctl

      - name: Upload binary artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7

  # ── OCI rock ────────────────────────────────────────────────────
  # The rock is built via rockcraft.yaml.
  # Publication to the OCI registry happens in publish-rock.

  build-rock:
    name: Build rock (OCI image)
    runs-on: ubuntu-latest
    needs: [release-metadata, validate-tag, test, integration-smoke]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.release-metadata.outputs.tag }}

      - name: Install LXD
        run: |
          sudo snap install lxd
          sudo lxd init --auto
          sudo usermod -aG lxd "$USER"

      - name: Install rockcraft
        run: sudo snap install rockcraft --classic

      - name: Pack rock
        run: sg lxd -c 'make rock-pack'

      - name: Smoke-test rock
        run: |
          ROCK_FILE=$(find . -maxdepth 1 -type f -name '*.rock' -print -quit)
          if [ -z "$ROCK_FILE" ]; then
            echo "::error::No .rock file produced"
            exit 1
          fi
          bash scripts/rock-smoke-test.sh "$ROCK_FILE"

      - name: Upload rock artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: charm-registry-rock
          path: "*.rock"
          retention-days: 7

  build-charm:
    name: Build charm
    runs-on: ubuntu-latest
    needs: [release-metadata, validate-tag, test, integration-smoke]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.release-metadata.outputs.tag }}

      - name: Install LXD
        run: |
          sudo snap install lxd
          sudo lxd init --auto
          sudo usermod -aG lxd "$USER"

      - name: Install charmcraft
        run: sudo snap install charmcraft --classic

      - name: Pack charm
        run: sg lxd -c 'make charm-pack'

      - name: Upload charm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: charm-registry-charm
          path: charm/*.charm
          retention-days: 7

  build-snap:
    name: Build snap
    runs-on: ubuntu-latest
    needs: [release-metadata, validate-tag, test, integration-smoke]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.release-metadata.outputs.tag }}

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Install LXD (required by snapcraft)
        run: |
          sudo snap install lxd
          sudo lxd init --auto
          sudo usermod -aG lxd "$USER"

      - name: Pack snap
        run: sg lxd -c 'make snap-pack'

      - name: Upload snap artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: charm-registry-snap
          path: "*.snap"
          retention-days: 7

  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [release-metadata, validate-tag, test, integration-smoke]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.release-metadata.outputs.tag }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: |
          mkdir -p dist
          syft dir:. -o spdx-json > dist/sbom.spdx.json
          syft dir:. -o cyclonedx-json > dist/sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: dist/
          retention-days: 7

  # ── GitHub release ──────────────────────────────────────────────
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [release-metadata, build-binaries, build-rock, build-charm, build-snap, generate-sbom]
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.release-metadata.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release artifacts
        run: find release-artifacts -type f | sort

      # Draft when: RC tag, OR dry-run mode (manual dispatch with dry_run=true)
      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ needs.release-metadata.outputs.tag }}
          generate_release_notes: true
          draft: ${{ needs.release-metadata.outputs.is_rc == 'true' || needs.release-metadata.outputs.is_dry_run == 'true' }}
          prerelease: ${{ needs.release-metadata.outputs.is_rc == 'true' }}
          files: |
            release-artifacts/charm-registry-*
            release-artifacts/charm-registryctl-*
            release-artifacts/*.snap
            release-artifacts/*.rock
            release-artifacts/*.charm
            release-artifacts/sbom.*

      - name: Attest build provenance
        if: needs.release-metadata.outputs.is_dry_run != 'true'
        uses: actions/attest-build-provenance@7668571508540a607bdfd90a87a560489fe372eb # v2.1.0
        with:
          subject-path: |
            release-artifacts/charm-registry-*
            release-artifacts/charm-registryctl-*
            release-artifacts/*.snap
            release-artifacts/*.rock
            release-artifacts/*.charm

      - name: Attest SBOM
        if: needs.release-metadata.outputs.is_dry_run != 'true'
        uses: actions/attest-sbom@cbfd0027ae731a5892db25ecd226930d7ffd19eb # v2.1.0
        with:
          subject-path: release-artifacts/charm-registry-linux-amd64
          sbom-path: release-artifacts/sbom.spdx.json

  # ════════════════════════════════════════════════════════════════
  # PUBLISH JOBS — only run when dry_run is false
  # ════════════════════════════════════════════════════════════════

  publish-charm:
    name: Publish charm to Charmhub
    runs-on: ubuntu-latest
    needs: [release-metadata, release]
    if: needs.release-metadata.outputs.is_dry_run != 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.release-metadata.outputs.tag }}

      - name: Download charm artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: charm-registry-charm
          path: charm

      - name: Install charmcraft
        run: sudo snap install charmcraft --classic

      - name: Authenticate with Charmhub
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
        run: |
          if [ -z "$CHARMCRAFT_AUTH" ]; then
            echo "::error::CHARMCRAFT_AUTH secret is not set. Configure it per docs/release.md."
            exit 1
          fi
          mkdir -p "$HOME/.local/share/snap/charmcraft/common"
          echo "$CHARMCRAFT_AUTH" > "$HOME/.local/share/snap/charmcraft/common/credentials"

      - name: Upload charm to Charmhub
        id: upload
        run: |
          CHARM_FILE=$(find charm -maxdepth 1 -type f -name '*.charm' -print -quit)
          BUILT_SHA=${{ github.sha }}
          echo "Uploading: ${CHARM_FILE}"
          echo "Built from commit: ${BUILT_SHA}"
          echo "built_sha=${BUILT_SHA}" >> "$GITHUB_OUTPUT"
          REVISION=$(charmcraft upload "$CHARM_FILE" --format=json | jq -r '.revision')
          if [ -z "$REVISION" ] || [ "$REVISION" = "null" ]; then
            echo "::error::Failed to parse charm revision from upload output"
            exit 1
          fi
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"
          echo "Charm uploaded as revision ${REVISION} (commit ${BUILT_SHA})"

      - name: Release charm on Charmhub
        run: |
          CHANNEL="${{ needs.release-metadata.outputs.channel }}"
          REVISION="${{ steps.upload.outputs.revision }}"
          echo "Releasing revision ${REVISION} to channel ${CHANNEL}"
          charmcraft release charm-registry --revision="$REVISION" --channel="$CHANNEL"

      - name: Verify charm release
        run: |
          echo "=== Charm status ==="
          charmcraft status charm-registry

  publish-rock:
    name: Publish rock to OCI registry
    runs-on: ubuntu-latest
    needs: [release-metadata, release]
    if: needs.release-metadata.outputs.is_dry_run != 'true'
    steps:
      - name: Download rock artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: charm-registry-rock
          path: .

      - name: Install skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

      - name: Determine registry credentials
        id: creds
        run: |
          REGISTRY="${{ needs.release-metadata.outputs.rock_registry }}"
          if [ "$REGISTRY" = "ghcr.io" ]; then
            echo "username=${{ github.actor }}" >> "$GITHUB_OUTPUT"
            echo "password=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_OUTPUT"
          else
            echo "username=${{ secrets.HARBOR_USERNAME }}" >> "$GITHUB_OUTPUT"
            echo "password=${{ secrets.HARBOR_PASSWORD }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to OCI registry via skopeo
        env:
          REGISTRY_USER: ${{ steps.creds.outputs.username }}
          REGISTRY_PASS: ${{ steps.creds.outputs.password }}
        run: |
          REGISTRY="${{ needs.release-metadata.outputs.rock_registry }}"
          skopeo login "$REGISTRY" -u "$REGISTRY_USER" -p "$REGISTRY_PASS"

      - name: Push rock image (version tag)
        run: |
          ROCK_FILE=$(find . -maxdepth 1 -type f -name '*.rock' -print -quit)
          IMAGE="${{ needs.release-metadata.outputs.rock_image }}"
          TAG="${{ needs.release-metadata.outputs.tag }}"
          echo "Pushing ${ROCK_FILE} → ${IMAGE}:${TAG}"
          skopeo copy \
            --insecure-policy \
            "oci-archive:${ROCK_FILE}" \
            "docker://${IMAGE}:${TAG}"

      - name: Push rock image (latest tag)
        if: needs.release-metadata.outputs.is_rc != 'true'
        run: |
          ROCK_FILE=$(find . -maxdepth 1 -type f -name '*.rock' -print -quit)
          IMAGE="${{ needs.release-metadata.outputs.rock_image }}"
          echo "Pushing ${ROCK_FILE} → ${IMAGE}:latest"
          skopeo copy \
            --insecure-policy \
            "oci-archive:${ROCK_FILE}" \
            "docker://${IMAGE}:latest"

      - name: Verify pushed image
        run: |
          IMAGE="${{ needs.release-metadata.outputs.rock_image }}"
          TAG="${{ needs.release-metadata.outputs.tag }}"
          DIGEST=$(skopeo inspect "docker://${IMAGE}:${TAG}" --format='{{.Digest}}')
          echo "Rock pushed: ${IMAGE}:${TAG}"
          echo "  Digest: ${DIGEST}"
          echo "  Built from commit: ${{ github.sha }}"

  publish-snap:
    name: Publish snap to Snap Store
    runs-on: ubuntu-latest
    needs: [release-metadata, release]
    if: needs.release-metadata.outputs.is_dry_run != 'true'
    steps:
      - name: Download snap artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: charm-registry-snap
          path: .

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Authenticate with Snap Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::error::SNAPCRAFT_STORE_CREDENTIALS secret is not set. Configure it per docs/release.md."
            exit 1
          fi

      - name: Upload snap to Snap Store
        id: upload
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          SNAP_FILE=$(find . -maxdepth 1 -type f -name '*.snap' -print -quit)
          BUILT_SHA=${{ github.sha }}
          echo "Uploading: ${SNAP_FILE}"
          echo "Built from commit: ${BUILT_SHA}"
          echo "built_sha=${BUILT_SHA}" >> "$GITHUB_OUTPUT"

          OUTPUT=$(snapcraft upload "$SNAP_FILE" 2>&1)
          echo "Upload output:"
          echo "$OUTPUT"

          REVISION=$(echo "$OUTPUT" | grep -oP 'Revision \K[0-9]+' || echo "")
          if [ -z "$REVISION" ]; then
            echo "::error::Failed to parse snap revision from upload output"
            exit 1
          fi
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"
          echo "Snap uploaded: revision ${REVISION} (commit ${BUILT_SHA})"

      - name: Release snap on Snap Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          CHANNEL="${{ needs.release-metadata.outputs.channel }}"
          REVISION="${{ steps.upload.outputs.revision }}"
          if [ -z "$REVISION" ]; then
            echo "::error::Could not determine snap revision number"
            exit 1
          fi
          echo "Releasing revision ${REVISION} to channel ${CHANNEL}"
          snapcraft release charm-registry "$REVISION" "$CHANNEL"

      - name: Verify snap release
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          echo "=== Snap channel map ==="
          snapcraft list-revisions charm-registry 2>/dev/null | head -10 || echo "(list-revisions not available in CI)"

  # ── Dry-run summary ─────────────────────────────────────────────
  dry-run-summary:
    name: Dry-run summary
    runs-on: ubuntu-latest
    needs: [release-metadata, release, build-binaries, build-rock, build-charm, build-snap, generate-sbom]
    if: needs.release-metadata.outputs.is_dry_run == 'true'
    steps:
      - name: Print dry-run summary
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║              DRY RUN COMPLETE                            ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║ Tag:     ${{ needs.release-metadata.outputs.tag }}"
          echo "║ Channel: ${{ needs.release-metadata.outputs.channel }}"
          echo "║ RC:      ${{ needs.release-metadata.outputs.is_rc }}"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║ Artifacts built (uploaded to GitHub Actions):            ║"
          echo "║   ✓ Go binaries (linux/darwin amd64/arm64)              ║"
          echo "║   ✓ OCI rock (.rock file)                               ║"
          echo "║   ✓ Charm (.charm file)                                 ║"
          echo "║   ✓ Snap (.snap file)                                   ║"
          echo "║   ✓ SBOM (SPDX + CycloneDX)                             ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║ GitHub release: created as DRAFT                        ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║ Publishing SKIPPED (dry_run=true):                      ║"
          echo "║   ✗ Charm → Charmhub (${{ needs.release-metadata.outputs.channel }})"
          echo "║   ✗ Rock  → ${{ needs.release-metadata.outputs.rock_image }}:${{ needs.release-metadata.outputs.tag }}"
          echo "║   ✗ Snap  → Snap Store (${{ needs.release-metadata.outputs.channel }})"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║ To publish for real:                                    ║"
          echo "║   Re-run with dry_run=false, or push a real tag.        ║"
          echo "╚══════════════════════════════════════════════════════════╝"
