name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.26.2"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check tag format
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! echo "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$'; then
            echo "::error::Tag '${TAG}' does not match expected semver pattern (vX.Y.Z or vX.Y.Z-rcN)"
            exit 1
          fi
          echo "Release tag validated: ${TAG}"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: validate-tag
    steps:
      - uses: actions/checkout@34e114876b0b011c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run audit
        run: make audit

      - name: Run unit tests with coverage
        run: make coverage

  build-binaries:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: [validate-tag, test]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@34e114876b0b011c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build charm-registry
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -buildvcs=true \
            -ldflags="-s -w -buildid=" \
            -o dist/charm-registry-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/charm-registry

      - name: Build charm-registryctl
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          CGO_ENABLED=0 go build -trimpath -buildvcs=true \
            -ldflags="-s -w -buildid=" \
            -o dist/charm-registryctl-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/charm-registryctl

      - name: Upload binary artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7

  build-container:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs: [validate-tag, test]
    permissions:
      contents: read
      packages: write
      # Needed for OIDC token exchange with cosign keyless signing
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b011c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29e803d8c3c3a89f8e6d6ee4dae3c06f7b8b4a0e # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216f676660f9b825b5de6e8561be5 # v3.11.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c71f5733e3175e554a4352d6e9e8ed2a64e0456f # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref, '-rc') }}
            type=sha

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd80a01e5294d6c9d86bc3c1553d8e7e4c48 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@263435390d3a27d4ab8b61ac8e5e3c5e71ed5e9b # v6.18.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign container image
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.meta.outputs.digest }}

  build-snap:
    name: Build snap
    runs-on: ubuntu-latest
    needs: [validate-tag, test]
    steps:
      - uses: actions/checkout@34e114876b0b011c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build snap
        run: snapcraft pack --destructive-mode

      - name: Upload snap artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: charm-registry-snap
          path: "*.snap"
          retention-days: 7

  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [validate-tag, test]
    steps:
      - uses: actions/checkout@34e114876b0b011c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: |
          mkdir -p dist
          syft dir:. -o spdx-json > dist/sbom.spdx.json
          syft dir:. -o cyclonedx-json > dist/sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: dist/
          retention-days: 7

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-container, build-snap, generate-sbom]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b011c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download all artifacts
        uses: actions/download-artifact@634f94c46c361b6c28e6b4e0e4e3e7b49457820c # v5.0.0
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release artifacts
        run: find release-artifacts -type f | sort

      - name: Create release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a32bf60 # v2.2.1
        with:
          generate_release_notes: true
          draft: ${{ contains(github.ref, '-rc') }}
          prerelease: ${{ contains(github.ref, '-rc') }}
          files: |
            release-artifacts/charm-registry-*
            release-artifacts/charm-registryctl-*
            release-artifacts/*.snap
            release-artifacts/sbom.*