name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "v[0-9]+.[0-9]+.[0-9]+*-rc[0-9]+"

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.26.4"

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check tag format
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! echo "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$'; then
            echo "::error::Tag '${TAG}' does not match expected semver pattern (vX.Y.Z or vX.Y.Z-rcN)"
            exit 1
          fi
          echo "Release tag validated: ${TAG}"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: validate-tag
    steps:
      - uses: actions/checkout@34e114876b0c011c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run audit
        run: make audit

      - name: Run unit tests with coverage
        run: make coverage

  build-binaries:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: [validate-tag, test]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@34e114876b0c011c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build charm-registry
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -buildvcs=true \
            -ldflags="-s -w -buildid=" \
            -o dist/charm-registry-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/charm-registry

      - name: Build charm-registryctl
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          CGO_ENABLED=0 go build -trimpath -buildvcs=true \
            -ldflags="-s -w -buildid=" \
            -o dist/charm-registryctl-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/charm-registryctl

      - name: Upload binary artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7

  # ── OCI rock (replaces Docker container image build) ─────────────
  # The rock is built via rockcraft.yaml (no Dockerfile).
  # T08 will add publication to the target OCI registry.

  build-rock:
    name: Build rock (OCI image)
    runs-on: ubuntu-latest
    needs: [validate-tag, test]
    steps:
      - uses: actions/checkout@34e114876b0c011c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install LXD
        run: |
          sudo snap install lxd
          sudo lxd init --auto
          sudo usermod -aG lxd "$USER"

      - name: Install rockcraft
        run: sudo snap install rockcraft --classic

      - name: Pack rock
        run: sg lxd -c 'rockcraft pack'

      - name: Smoke-test rock
        run: |
          ROCK_FILE=$(ls *.rock 2>/dev/null | head -1)
          if [ -z "$ROCK_FILE" ]; then
            echo "::error::No .rock file produced"
            exit 1
          fi
          bash scripts/rock-smoke-test.sh "$ROCK_FILE"

      - name: Upload rock artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: charm-registry-rock
          path: "*.rock"
          retention-days: 7

  build-charm:
    name: Build charm
    runs-on: ubuntu-latest
    needs: [validate-tag, test]
    steps:
      - uses: actions/checkout@34e114876b0c011c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install charmcraft
        run: sudo snap install charmcraft --classic

      - name: Pack charm
        run: |
          cd charm
          charmcraft pack

      - name: Upload charm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: charm-registry-charm
          path: charm/*.charm
          retention-days: 7

  build-snap:
    name: Build snap
    runs-on: ubuntu-latest
    needs: [validate-tag, test]
    steps:
      - uses: actions/checkout@34e114876b0c011c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Install LXD (required by snapcraft)
        run: |
          sudo snap install lxd
          sudo lxd init --auto

      - name: Pack snap
        run: snapcraft pack --use-lxd

      - name: Upload snap artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: charm-registry-snap
          path: "*.snap"
          retention-days: 7

  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [validate-tag, test]
    steps:
      - uses: actions/checkout@34e114876b0c011c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: |
          mkdir -p dist
          syft dir:. -o spdx-json > dist/sbom.spdx.json
          syft dir:. -o cyclonedx-json > dist/sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: dist/
          retention-days: 7

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-rock, build-charm, build-snap, generate-sbom]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0c011c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download all artifacts
        uses: actions/download-artifact@634f94c46c361b6c28e6b4e0e4e3e7b49457820c # v5.0.0
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release artifacts
        run: find release-artifacts -type f | sort

      - name: Create release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a32bf60 # v2.2.1
        with:
          generate_release_notes: true
          draft: ${{ contains(github.ref, '-rc') }}
          prerelease: ${{ contains(github.ref, '-rc') }}
          files: |
            release-artifacts/charm-registry-*
            release-artifacts/charm-registryctl-*
            release-artifacts/*.snap
            release-artifacts/*.rock
            release-artifacts/*.charm
            release-artifacts/sbom.*
