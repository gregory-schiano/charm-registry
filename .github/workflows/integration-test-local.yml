name: Integration Test

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      upload-image:
        type: string
        default: "artifact"
      spread-jobs-include:
        type: string
        default: ""
      build-timeout-minutes:
        type: number
        default: 60
      test-timeout-minutes:
        type: number
        default: 120
      charmcraft-channel:
        type: string
        default: "latest/edge"
      rockcraft-channel:
        type: string
        default: "latest/stable"

jobs:
  build:
    uses: ./.github/workflows/build-artifacts-local.yml
    permissions:
      actions: read
      contents: read
      packages: write
    with:
      working-directory: ${{ inputs.working-directory }}
      upload-image: ${{ inputs.upload-image }}
      build-timeout-minutes: ${{ inputs.build-timeout-minutes }}
      charmcraft-channel: ${{ inputs.charmcraft-channel }}
      rockcraft-channel: ${{ inputs.rockcraft-channel }}

  test-matrix:
    name: Test matrix
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      opcli-sha: ${{ steps.workflow-version.outputs.sha }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set opcli version
        id: workflow-version
        run: echo "sha=main" >> "$GITHUB_OUTPUT"

      - name: Install uv
        run: sudo snap install astral-uv --classic

      - name: Install opcli
        run: uv tool install "opcli[cli] @ git+https://github.com/canonical/charm-ci.git@${{ steps.workflow-version.outputs.sha }}"

      - name: Install spread
        run: |
          sudo snap install go --classic
          go install github.com/canonical/spread/cmd/spread@latest
          sudo ln -sf ~/go/bin/spread /usr/local/bin/spread

      - name: Generate test matrix
        id: matrix
        run: |
          args=()
          if [ -n "${{ inputs.spread-jobs-include }}" ]; then
            args+=(--include "${{ inputs.spread-jobs-include }}")
          fi
          matrix=$(opcli spread jobs "${args[@]}")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Test matrix: $matrix"

  test:
    name: "${{ matrix.name }}"
    needs: [build, test-matrix]
    runs-on: ${{ fromJSON(matrix.runs-on) }}
    timeout-minutes: ${{ inputs.test-timeout-minutes }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-matrix.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        run: sudo snap install astral-uv --classic

      - name: Install opcli
        run: uv tool install "opcli[cli] @ git+https://github.com/canonical/charm-ci.git@${{ needs.test-matrix.outputs.opcli-sha }}"

      - name: Install spread
        run: |
          sudo snap install go --classic
          go install github.com/canonical/spread/cmd/spread@latest
          sudo ln -sf ~/go/bin/spread /usr/local/bin/spread

      - name: Fix LXD+Docker forwarding
        run: |
          sudo iptables -P FORWARD ACCEPT
          if sudo iptables -nL DOCKER-USER 2>/dev/null; then
            sudo iptables -I DOCKER-USER -i lxdbr0 -j ACCEPT
            sudo iptables -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          fi
          if sudo ip6tables -nL DOCKER-USER 2>/dev/null; then
            sudo ip6tables -I DOCKER-USER -i lxdbr0 -j ACCEPT
            sudo ip6tables -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          fi

      - name: Run spread task
        env:
          CI: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPCLI_GIT_REF: ${{ needs.test-matrix.outputs.opcli-sha }}
        run: opcli spread run -- -vv ${{ matrix.selector }}

      - name: Juju status (on failure)
        if: failure()
        run: |
          if id ubuntu >/dev/null 2>&1; then
            sudo -u ubuntu bash -c '
              juju models --format json | jq -r ".models[].\"short-name\"" | while IFS= read -r model; do
                echo "=== juju status for model: $model ==="
                juju status -m "$model" --relations --storage || true
              done
            '
          fi

      - name: Juju debug-log (on failure)
        if: failure()
        run: |
          if id ubuntu >/dev/null 2>&1; then
            sudo -u ubuntu juju debug-log --replay || true
          fi
