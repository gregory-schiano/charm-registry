name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  integration-test:
    name: Charm-CI Integration
    uses: ./.github/workflows/integration-test-local.yml
    secrets: inherit
    permissions:
      actions: read
      contents: read
      packages: write
    with:
      working-directory: .
      upload-image: artifact
      charmcraft-channel: latest/edge
      rockcraft-channel: latest/edge
      test-timeout-minutes: 120

  required-status-checks:
    name: Required Integration Test Status Checks
    runs-on: ubuntu-latest
    needs: [integration-test]
    if: always() && !cancelled()
    steps:
      - name: Check integration test status
        run: |
          result="${{ needs.integration-test.result }}"
          if [ "$result" != "success" ]; then
            echo "::error::Integration tests failed or were skipped: ${result}"
            exit 1
          fi
