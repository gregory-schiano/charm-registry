project: charm-registry

backends:
  integration-test:
    type: integration-test
    systems:
      - ubuntu-24.04:
          runner: [ubuntu-latest]
          cpu: 4
          memory: 8
          disk: 20
  snap-test:
    type: opcli-minimal
    systems:
      - ubuntu-24.04:
          runner: [ubuntu-latest]

path: /home/test/charm-registry

# Backend/project prepare (opcli bootstrap + concierge provisioning Canonical
# K8s and Juju) regularly needs more than spread's 15m default kill-timeout.
warn-timeout: 15m
kill-timeout: 40m

environment:
  PROJECT_DIR: /home/test/charm-registry
  SNAP_NAME: spellbook
  FTEST_API_URL: "http://localhost:8080"
  FTEST_OCI_URL: "https://127.0.0.1:5000"
  FTEST_OCI_CERT_PATH: "/var/snap/spellbook/common/certs/oci.crt"
  FTEST_ADMIN_SUBJECT: admin
  FTEST_ADMIN_USER: admin
  CONCIERGE: '$(HOST: echo "${CONCIERGE:-concierge.yaml}")'
  OPCLI_GIT_REF: '$(HOST: echo "${OPCLI_GIT_REF:-v0.0.1-alpha.7}")'

prepare: |
  # Install Go for building the functional-test binary
  snap install go --classic --channel=1.26/stable
  if [ -n "${GITHUB_RUN_ID:-}" ] && [ "${SPREAD_BACKEND:-}" != "integration-test-ci" ]; then
    export UV_TOOL_BIN_DIR=/usr/local/bin
    export UV_TOOL_DIR=/usr/local/share/uv-tools
    if ! command -v opcli >/dev/null 2>&1; then
      uv tool install "opcli[cli] @ git+https://github.com/canonical/charm-ci@${OPCLI_GIT_REF:-v0.0.1-alpha.7}" --quiet
    fi
    export GH_TOKEN="${GITHUB_TOKEN}"
    opcli artifacts fetch --run-id "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --wait
  fi

restore: |
  if snap list spellbook 2>/dev/null; then
    snap remove --purge spellbook
  fi

suites:
  tests/spread/:
    summary: "charm-registry snap integration tests"
    systems: [ubuntu-24.04]
    backends: [snap-test]

# Suite prepare hooks provision test-specific host services (S3 storage, the
# local snap registry) and export their endpoints/credentials through
# /etc/profile.d. The pytest process runs in a `runuser -l ubuntu` login shell
# and receives them via tox pass_env, so the Python tests only consume the
# contract and never mutate the host.
integration-suites:
  tests/integration/charm/:
    summary: "charm-registry charm integration tests"
    working-dir: charm
    backends: [integration-test]
    # The Juju deploy alone budgets up to 30m (jubilant wait timeout); spread's
    # default kill-timeout is 15m, which kills the suite mid-deploy.
    warn-timeout: 30m
    kill-timeout: 60m
    environment:
      TOX_ENV: integration
    prepare: |
      "${PROJECT_DIR}/tests/integration/scripts/setup-microceph-rgw.sh"
    restore: |
      rm -f /etc/profile.d/zz-charm-registry-s3.sh
  tests/integration/terraform/:
    summary: "charm-registry Terraform deployment tests"
    working-dir: charm
    backends: [integration-test]
    # Stack apply waits up to 30m and the lifecycle test adds publish + consumer
    # deploy/refresh waits (15m + 10m); 10m would kill the suite mid-run.
    warn-timeout: 30m
    kill-timeout: 75m
    environment:
      TOX_ENV: integration
    prepare: |
      if ! command -v skopeo >/dev/null 2>&1; then
        apt-get update
        apt-get install -y skopeo
      fi
      "${PROJECT_DIR}/tests/integration/scripts/setup-snap-registry.sh"
      "${PROJECT_DIR}/tests/integration/scripts/publish-test-charms.sh"
      cd "${PROJECT_DIR}"
      go build -buildvcs=false -o "${PROJECT_DIR}/.bin/functional-test" ./cmd/functional-test
      chown -R ubuntu:ubuntu "${PROJECT_DIR}/.bin"
      # Kubernetes must be ready before pytest applies the Terraform module;
      # kubectl is configured for the ubuntu user by the backend provisioning.
      runuser -l ubuntu -c "kubectl wait --for=condition=Ready node --all --timeout=5m"
    restore: |
      rm -f /etc/profile.d/zz-charm-registry-registry.sh
      # Undo the consumer-model host plumbing added by the lifecycle test
      # (tests/integration/scripts/setup-consumer-oci-registry.sh).
      sed -i '\|# charm-registry-tf-itest|d' /etc/hosts
      rm -f /etc/containers/registries.conf.d/charm-registry-tf-itest.conf
      if [ -f /var/lib/charm-registry-tf-itest-containerd-hosts ]; then
        while read -r host_dir; do
          [ -n "${host_dir}" ] && rm -rf "${host_dir}"
        done < /var/lib/charm-registry-tf-itest-containerd-hosts
        rm -f /var/lib/charm-registry-tf-itest-containerd-hosts
      fi
      if [ -f /usr/local/share/ca-certificates/charm-registry-tf-itest.crt ]; then
        rm -f /usr/local/share/ca-certificates/charm-registry-tf-itest.crt
        update-ca-certificates --fresh >/dev/null || true
      fi
      rm -f /usr/local/share/ca-certificates/charm-registry-oci-*.crt
      update-ca-certificates --fresh >/dev/null || true
      for root in /etc/containerd/certs.d \
          /etc/containerd/hosts.d \
          /ck8s/k8s-containerd/etc/containerd/certs.d \
          /ck8s/k8s-containerd/etc/containerd/hosts.d \
          /var/snap/k8s/common/etc/containerd/certs.d \
          /var/snap/k8s/common/etc/containerd/hosts.d; do
        rm -rf "${root}/oci.charm-registry-tf.test"
      done
      if systemctl is-active --quiet containerd 2>/dev/null; then
        systemctl restart containerd
      fi
      if systemctl is-active --quiet snap.k8s.containerd.service 2>/dev/null; then
        systemctl restart snap.k8s.containerd.service
      fi
      if snap services k8s.containerd >/dev/null 2>&1; then
        snap restart k8s.containerd || true
      fi
