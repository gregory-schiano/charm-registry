project: charm-registry

backends:
  integration-test:
    type: integration-test
    systems:
      - ubuntu-24.04:
          runner: [ubuntu-latest]
          cpu: 4
          memory: 8
          disk: 20
  snap-test:
    type: opcli-minimal
    systems:
      - ubuntu-24.04:
          runner: [ubuntu-latest]

path: /home/test/charm-registry

environment:
  PROJECT_DIR: /home/test/charm-registry
  SNAP_NAME: spellbook
  FTEST_API_URL: "http://localhost:8080"
  FTEST_OCI_URL: "https://127.0.0.1:5000"
  FTEST_OCI_CERT_PATH: "/var/snap/spellbook/common/certs/oci.crt"
  FTEST_ADMIN_SUBJECT: admin
  FTEST_ADMIN_USER: admin
  CONCIERGE: '$(HOST: echo "${CONCIERGE:-concierge.yaml}")'
  OPCLI_GIT_REF: '$(HOST: echo "${OPCLI_GIT_REF:-v0.0.1-alpha.7}")'

prepare: |
  # Install Go for building the functional-test binary
  snap install go --classic --channel=1.26/stable
  if [ -n "${GITHUB_RUN_ID:-}" ] && [ "${SPREAD_BACKEND:-}" != "integration-test-ci" ]; then
    export UV_TOOL_BIN_DIR=/usr/local/bin
    export UV_TOOL_DIR=/usr/local/share/uv-tools
    if ! command -v opcli >/dev/null 2>&1; then
      uv tool install "opcli[cli] @ git+https://github.com/canonical/charm-ci@${OPCLI_GIT_REF:-v0.0.1-alpha.7}" --quiet
    fi
    export GH_TOKEN="${GITHUB_TOKEN}"
    opcli artifacts fetch --run-id "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --wait
  fi

restore: |
  if snap list spellbook 2>/dev/null; then
    snap remove --purge spellbook
  fi

suites:
  tests/spread/:
    summary: "charm-registry snap integration tests"
    systems: [ubuntu-24.04]
    backends: [snap-test]

# Suite prepare hooks provision test-specific host services (S3 storage, the
# local snap registry) and export their endpoints/credentials through
# /etc/profile.d. The pytest process runs in a `runuser -l ubuntu` login shell
# and receives them via tox pass_env, so the Python tests only consume the
# contract and never mutate the host.
integration-suites:
  tests/integration/charm/:
    summary: "charm-registry charm integration tests"
    working-dir: charm
    backends: [integration-test]
    environment:
      TOX_ENV: integration
    prepare: |
      "${PROJECT_DIR}/tests/integration/scripts/setup-microceph-rgw.sh"
    restore: |
      rm -f /etc/profile.d/zz-charm-registry-s3.sh
  tests/integration/terraform/:
    summary: "charm-registry Terraform deployment tests"
    working-dir: charm
    backends: [integration-test]
    warn-timeout: 10m
    kill-timeout: 45m
    environment:
      TOX_ENV: integration
    prepare: |
      "${PROJECT_DIR}/tests/integration/scripts/setup-snap-registry.sh"
      "${PROJECT_DIR}/tests/integration/scripts/publish-test-charms.sh"
    restore: |
      rm -f /etc/profile.d/zz-charm-registry-registry.sh
